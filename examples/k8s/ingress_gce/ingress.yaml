apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-gce
  annotations:
    kubernetes.io/ingress.class: gce
spec:
  rules:
    - host: example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-gce
                port:
                  number: 80
